{% extends "WCHDApp/masterTemplate.html" %}
{% load static %}

{% block title %}WCHD Projections{% endblock %}
{% block content %}
    <link rel="stylesheet" type="text/css" href="{% static 'WCHDApp/css/cleanPages.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'WCHDApp/css/themes.css' %}">
    <h1>WCHD Expense Projections</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Calculate</button>
    </form>

    {% if result %}
        <p>{{ result|linebreaksbr }}</p>
        <h2>Employee Expense Breakdown</h2>
        <img src="data:image/png;base64,{{ result_image }}" alt ="Projection Chart">
    {% endif %}
{% endblock %}
